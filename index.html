<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philosophers</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Montserrat', sans-serif;
    }

    .bg-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .bg-container img {
      position: absolute;
      top: 0;
      left: 50%;
      height: 100%;
      width: auto;
      transform: translateX(-50%);
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    /* Klick-Layer über dem gesamten Bild */
    .click-layer {
      position: absolute;
      inset: 0;
      z-index: 9;
      cursor: pointer;
    }

    /* Funken-Layer */
    .sparks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, #ffdd55, #ff6a00);
      border-radius: 50%;
      opacity: 0;
      animation: rise linear forwards;
      filter: blur(1px);
    }

    @keyframes rise {
      0% {
        transform: translate(0, 0) scale(0.6);
        opacity: 0.8;
      }
      50% {
        transform: translate(var(--drift-x), -60px) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(calc(var(--drift-x) * 2), -140px) scale(0.4);
        opacity: 0;
      }
    }

    /* Türspalt */
    .door-gap {
      position: absolute;
      top: 44%;
      left: calc(50% + 10px);
      transform: translateX(-50%);
      height: 50%;
      width: 10px;
      border-radius: 5px;

      background: linear-gradient(180deg, #ff6a00, #ffd700);
      box-shadow: 0 0 25px 8px #ff6a00;

      cursor: pointer;
      transition: width 0.4s ease, box-shadow 0.4s ease;

      animation: pulse 2.2s infinite;
      z-index: 10;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 25px 8px #ff6a00; }
      50% { box-shadow: 0 0 40px 14px #ffd700; }
    }

    .door-gap:hover {
      width: 20px;
      box-shadow: 0 0 70px 25px #ff6a00;
    }

    /* Hover-Text */
    .hover-text {
      position: absolute;
      top: 44%;
      left: calc(50% + 40px);
      transform: translateY(-50%);
      color: #ffd38a;
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.4s ease;
      text-shadow: 0 0 10px #ff6a00;
      z-index: 15;
      width: 300px;
      pointer-events: none;
    }

    /* Hover zeigt Text */
    .door-gap:hover + .hover-text {
      opacity: 1;
    }

    .logo {
      position: absolute;
      top: 5%;
      width: 100%;
      text-align: center;
      color: #ff6a00;
      font-size: 2.4rem;
      letter-spacing: 4px;
      text-shadow: 0 0 20px #ff6a00;
      z-index: 20;
      pointer-events: none;
      user-select: none;
    }

  </style>
</head>

<body>

  <div class="bg-container">
    <img src="./Philosophers-Landing.jpg" alt="Philosophers Portal">

    <!-- Klick-Layer -->
    <div class="click-layer" id="clickLayer"></div>

    <!-- Funken -->
    <div class="sparks" id="sparks"></div>

    <!-- Türspalt -->
    <div class="door-gap" id="door-gap"></div>

    <!-- Hover-Text -->
    <div class="hover-text" id="hoverText">Open the door<br>and face yourself</div>
  </div>

  <script>
    const sparks = document.getElementById('sparks');
    const hoverText = document.getElementById('hoverText');

    /* Bild klickbar machen */
    document.getElementById('clickLayer').addEventListener('click', () => {
      window.location.href = 'news.html';
    });

    /* Türspalt klickbar */
    document.getElementById('door-gap').addEventListener('click', () => {
      window.location.href = 'news.html';
    });

    /* Funken erzeugen */
    function createSpark() {
      const spark = document.createElement('div');
      spark.classList.add('spark');

      spark.style.left = Math.random() * window.innerWidth + 'px';
      spark.style.top = (Math.random() * window.innerHeight) + 'px';

      const size = Math.random() * 4 + 2;
      spark.style.width = size + 'px';
      spark.style.height = size + 'px';

      const drift = (Math.random() - 0.5) * 80;
      spark.style.setProperty('--drift-x', drift + 'px');

      const speed = 1.6 + Math.random() * 1.2;
      spark.style.animationDuration = speed + 's';

      sparks.appendChild(spark);

      setTimeout(() => spark.remove(), speed * 1000);
    }

    setInterval(createSpark, 120);

    /* Text nach 2 Sekunden automatisch einblenden */
    setTimeout(() => {
      hoverText.style.opacity = 1;
    }, 2000);

  </script>

</body>
</html>
